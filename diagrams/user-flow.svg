<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E1424" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0E1424">User Flow: Fitur Tambah Kamar Massal &amp; Duplikat Kamar (Ngekost)</text>
  <text x="50" y="70" font-size="13" fill="#64748B">Alur interaksi pengelola kost dari eksplorasi daftar kamar hingga data kamar tersimpan sukses.</text>

  <!-- Legend -->
  <g transform="translate(730, 25)">
    <rect x="0" y="0" width="420" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="20" cy="25" r="7" fill="#2563EB" />
    <text x="35" y="29" font-size="11" fill="#334155" font-weight="600">Alur Utama</text>
    <circle cx="125" cy="25" r="7" fill="#DC2626" />
    <text x="140" y="29" font-size="11" fill="#334155" font-weight="600">Percabangan Error</text>
    <circle cx="265" cy="25" r="7" fill="#0D9488" />
    <text x="280" y="29" font-size="11" fill="#334155" font-weight="600">Jalur Duplikat</text>
  </g>

  <!-- NODE 1: Start (Daftar Kamar / Empty State) -->
  <g transform="translate(50, 130)">
    <rect width="180" height="85" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#64748B" />
    <text x="90" y="32" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">MULAI (START)</text>
    <text x="90" y="52" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Daftar Kamar</text>
    <text x="90" y="70" font-size="10.5" fill="#64748B" text-anchor="middle">Screen 1 / Screen 2 (Empty)</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 230 172 L 275 172" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="252" y="162" font-size="9.5" fill="#64748B" text-anchor="middle">Klik CTA</text>

  <!-- NODE 2: Pilih Metode Tambah -->
  <g transform="translate(280, 130)">
    <rect width="180" height="85" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#3B82F6" />
    <text x="90" y="32" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">PILIH METODE</text>
    <text x="90" y="52" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Pilih Cara Menambah</text>
    <text x="90" y="70" font-size="10.5" fill="#64748B" text-anchor="middle">Screen 3 (Modal Opsi)</text>
  </g>

  <!-- Flow 2 to 3 (Main Path: Tambah Massal) -->
  <path d="M 460 172 L 515 172" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="488" y="162" font-size="9.5" font-weight="600" fill="#2563EB" text-anchor="middle">Massal</text>

  <!-- NODE 3: Form Tambah Kamar Massal -->
  <g transform="translate(520, 120)">
    <rect width="200" height="105" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#2563EB" />
    <text x="100" y="30" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">INPUT SPESIFIKASI</text>
    <text x="100" y="50" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Form Tambah Massal</text>
    <text x="100" y="68" font-size="10" fill="#475569" text-anchor="middle">• Tipe, Fasilitas, Harga Sewa</text>
    <text x="100" y="84" font-size="10" fill="#475569" text-anchor="middle">• Jumlah &amp; Rentang Nomor Auto</text>
    <text x="100" y="99" font-size="9.5" fill="#64748B" text-anchor="middle">Screen 4</text>
  </g>

  <!-- Flow 3 to 4 -->
  <path d="M 720 172 L 775 172" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="748" y="162" font-size="9.5" font-weight="600" fill="#2563EB" text-anchor="middle">Lanjut</text>

  <!-- NODE 4: Pratinjau & Ringkasan -->
  <g transform="translate(780, 120)">
    <rect width="200" height="105" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#2563EB" />
    <text x="100" y="30" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">VERIFIKASI &amp; KOREKSI</text>
    <text x="100" y="50" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Ringkasan Tabel Kamar</text>
    <text x="100" y="68" font-size="10" fill="#475569" text-anchor="middle">• Cek Semua Baris Kamar</text>
    <text x="100" y="84" font-size="10" fill="#475569" text-anchor="middle">• Edit / Hapus Baris di Tempat</text>
    <text x="100" y="99" font-size="9.5" fill="#64748B" text-anchor="middle">Screen 5</text>
  </g>

  <!-- Flow 4 to Decision 1 -->
  <path d="M 880 225 L 880 285" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="895" y="255" font-size="9.5" font-weight="600" fill="#2563EB">Klik "Simpan Semua"</text>

  <!-- DECISION NODE: Validasi Nomor -->
  <g transform="translate(880, 340)">
    <polygon points="0,-45 75,0 0,45 -75,0" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="-8" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Validasi</text>
    <text x="0" y="8" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Nomor Kamar?</text>
  </g>

  <!-- Branch 1: Error Kembar (Ada duplikat) -> Ke Screen 6 -->
  <path d="M 805 340 L 685 340" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="745" y="330" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Ada Nomor Kembar</text>

  <!-- NODE 5: Error State (Screen 6) -->
  <g transform="translate(480, 290)">
    <rect width="200" height="100" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#EF4444" />
    <text x="100" y="28" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">ERROR STATE</text>
    <text x="100" y="47" font-size="13" font-weight="700" fill="#991B1B" text-anchor="middle">Peringatan Nomor Kembar</text>
    <text x="100" y="66" font-size="10" fill="#7F1D1D" text-anchor="middle">• Pesan error menyebut nomor</text>
    <text x="100" y="82" font-size="10" fill="#7F1D1D" text-anchor="middle">• Baris ditandai merah &amp; diedit</text>
    <text x="100" y="95" font-size="9" fill="#B91C1C" text-anchor="middle">Screen 6</text>
  </g>

  <!-- Loop back from Error to Ringkasan Table -->
  <path d="M 580 290 L 580 255 L 775 255 L 820 225" fill="none" stroke="#DC2626" stroke-dasharray="4,3" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="680" y="247" font-size="9.5" font-weight="600" fill="#DC2626" text-anchor="middle">Koreksi nomor di tempat &amp; simpan ulang</text>

  <!-- Branch 2: Nomor Valid -> Progres Simpan & Konfirmasi -->
  <path d="M 880 385 L 880 440" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="940" y="415" font-size="10" font-weight="700" fill="#16A34A" text-anchor="middle">Valid / Unik (OK)</text>

  <!-- NODE 6: Progres Simpan & Sukses (Screen 7) -->
  <g transform="translate(780, 445)">
    <rect width="200" height="110" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#22C55E" />
    <text x="100" y="28" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">HASIL / RESULT</text>
    <text x="100" y="48" font-size="13" font-weight="700" fill="#14532D" text-anchor="middle">Simpan &amp; Sukses</text>
    <text x="100" y="67" font-size="10" fill="#166534" text-anchor="middle">• Indikator Progres Bar</text>
    <text x="100" y="83" font-size="10" fill="#166534" text-anchor="middle">• Konfirmasi "N kamar berhasil"</text>
    <text x="100" y="98" font-size="9.5" fill="#15803D" text-anchor="middle">Screen 7</text>
  </g>

  <!-- Flow back to Daftar Kamar -->
  <path d="M 780 500 L 140 500 L 140 220" fill="none" stroke="#64748B" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="490" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Klik "Lihat Daftar Kamar" → Kembali ke Daftar Kamar yang telah terupdate</text>

  <!-- JALUR ALTERNATIF: DUPLIKAT KAMAR (Screen 8) -->
  <!-- Dari Daftar Kamar (klik aksi 'Duplikat' di kartu) -->
  <path d="M 140 215 L 140 280 L 280 280" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="272" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="middle">Aksi "Duplikat"</text>

  <!-- Atau dari Screen 3 (Pilih opsi Duplikat) -->
  <path d="M 370 215 L 370 240" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)" />

  <!-- NODE 7: Modal Duplikat Kamar -->
  <g transform="translate(260, 245)">
    <rect width="180" height="110" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#0D9488" />
    <text x="90" y="28" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">JALUR ALTERNATIF</text>
    <text x="90" y="48" font-size="12.5" font-weight="700" fill="#134E4A" text-anchor="middle">Duplikat Kamar</text>
    <text x="90" y="67" font-size="9.5" fill="#115E59" text-anchor="middle">• Pilih Kamar Sumber</text>
    <text x="90" y="82" font-size="9.5" fill="#115E59" text-anchor="middle">• Salin Data &amp; Ubah Nomor</text>
    <text x="90" y="98" font-size="9" fill="#0F766E" text-anchor="middle">Screen 8</text>
  </g>

  <!-- Flow from Duplikat to Validation / Save -->
  <path d="M 350 355 L 350 420 L 780 475" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="430" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="middle">Simpan Duplikasi Kamar</text>

</svg>
